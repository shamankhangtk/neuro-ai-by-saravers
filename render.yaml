services:
  - type: web
    name: neuro-ai-by-saravers
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: NEURO_ADMIN_USERNAME
        sync: false
      - key: NEURO_ADMIN_PASSWORD
        sync: false
